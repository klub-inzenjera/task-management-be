name: Build and Push Docker Image

on:
  push:
    branches:
      - "**"
#      - main

permissions:
  id-token: write  # Required for OIDC authentication
  contents: read

jobs:
  python-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run flake8 (Python Linter)
        run: |
          flake8 . --max-line-length=120
        continue-on-error: true

      - name: Run black (Python Formatter)
        run: |
          black --check .
        continue-on-error: true

  docker-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/fastapi-app:latest .

      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/fastapi-app:latest
  
  azure-login-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Subscription Access
        run: az account show

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp up \
            --name task-management-be \
            --resource-group klub-inzenjera \
            --image ghcr.io/${{ github.repository_owner }}/fastapi-app:latest \
            --ingress external


